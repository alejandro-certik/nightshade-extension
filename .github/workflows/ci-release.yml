name: Test, package, and release

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Package VSIX
        run: npm run package

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightshade-inline
          path: nightshade-inline.vsix
          if-no-files-found: error
          retention-days: 14

  release-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install latest Nightshade and scan positive/negative controls
        run: npm run test:release

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-and-package, release-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download packaged VSIX
        uses: actions/download-artifact@v4
        with:
          name: nightshade-inline
          path: dist

      - name: Verify release tag matches package version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "v${PACKAGE_VERSION}" = "${GITHUB_REF_NAME}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/nightshade-inline.vsix
          --verify-tag
          --generate-notes
          --title "Nightshade Inline ${GITHUB_REF_NAME}"
